name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Lint y pruebas del backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Base de datos temporal solo para el CI (se destruye al terminar el job)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reactor
          POSTGRES_PASSWORD: reactor_ci
          POSTGRES_DB: reactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reactor -d reactor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://reactor:reactor_ci@localhost:5432/reactor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migraciones (alembic)
        run: alembic upgrade head

      - name: Pruebas (pytest)
        run: pytest

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen del backend
        run: docker build -t control-del-reactor-server ./server
