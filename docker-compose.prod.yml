# Despliegue en la nube (VM de Azure). Ver docs/despliegue.md.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias con docker-compose.yml (desarrollo):
# - La base y el backend NO publican puertos: solo Caddy (servicio web) abre 80 y 443.
# - El backend corre sin --reload y sin montar el código: usa lo que quedó en la imagen.
# - Caddy saca el certificado HTTPS solo, manda /api/* al backend y sirve el cliente web (pygbag).
# - El .env de producción vive solo en la VM (plantilla: deploy/.env.prod.example).
name: control-del-reactor

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: always
    env_file: .env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    # Migraciones pendientes y después la API. --proxy-headers: detrás de Caddy, para que la API
    # sepa que el cliente entró por https.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips='*'"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: always
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data # certificados de Let's Encrypt (no borrar: hay límite de emisiones)
      - caddy_config:/config
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
